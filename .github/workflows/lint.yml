name: lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

cache-mode: none

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # pin@v1.319.0
        with:
          bundler-cache: false

      - name: install dependencies
        run: |
          bundle config set --local path "$PWD/vendor/bundle"
          bundle config set --local deployment true
          bundle install --jobs 4

      - name: bootstrap
        run: script/bootstrap

      - name: lint
        run: script/lint
